name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Evita ejecuciones paralelas (y ramas duplicadas) sobre el mismo issue o PR.
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      # El modelo se lee de .claude/settings.json en cada ejecución.
      # Para cambiarlo: editar "model" en ese archivo, hacer commit y push a main.
      - name: Leer modelo del proyecto
        id: modelo
        run: |
          MODELO=$(jq -r '.model // empty' .claude/settings.json)
          echo "model=${MODELO:-claude-sonnet-5-5}" >> "$GITHUB_OUTPUT"

      - name: Registrar modelo usado
        run: |
          echo "Modelo configurado para esta ejecución: \`${{ steps.modelo.outputs.model }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Muestra el avance como lista de tareas con casillas mientras Claude trabaja
          track_progress: true

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          claude_args: '--model ${{ steps.modelo.outputs.model }}'

      # Busca en el registro de la sesión los modelos que respondieron de verdad.
      # Compara con el modelo pedido para detectar si no coinciden.
      - name: Verificar modelo que respondió
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          PEDIDO: ${{ steps.modelo.outputs.model }}
          ARCHIVO: ${{ steps.claude.outputs.execution_file }}
        run: |
          REALES=$(jq -r '.. | objects | .model? // empty' "$ARCHIVO" 2>/dev/null | sort -u | paste -sd ', ' -)
          {
            echo "### Modelo verificado"
            echo "- Pedido: \`$PEDIDO\`"
            echo "- Respondió: \`${REALES:-no detectado}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$REALES" ] && ! echo "$REALES" | grep -q "$PEDIDO"; then
            echo "::warning::El modelo que respondió ($REALES) no coincide con el pedido ($PEDIDO)"
          fi
