name: QA

# Ejecuta las pruebas Playwright de un issue y publica la evidencia en su hilo.
# Se lanza solo al hacer merge de una PR hacia qa, o a mano desde Actions → QA → Run workflow.
# El issue sale de la rama (claude/issue-N-…) o de "Refs #N" en la descripción de la PR.
# No hace merge ni cierra el issue: eso lo decide una persona.
on:
  workflow_dispatch:
    inputs:
      issue:
        description: Número del issue a verificar
        required: true
  pull_request:
    types: [closed]
    branches: [qa]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  qa:
    # En PRs, solo cuando se hizo merge (no al cerrar sin fusionar)
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Determinar issue
        id: issue
        env:
          ENTRADA: ${{ inputs.issue }}
          RAMA: ${{ github.event.pull_request.head.ref }}
          CUERPO: ${{ github.event.pull_request.body }}
        run: |
          NUMERO="$ENTRADA"
          if [ -z "$NUMERO" ]; then
            NUMERO=$(echo "$RAMA" | sed -nE 's#^claude/issue-([0-9]+)-.*#\1#p')
          fi
          if [ -z "$NUMERO" ]; then
            NUMERO=$(printf '%s' "$CUERPO" | grep -oE 'Refs #[0-9]+' | head -1 | tr -dc '0-9')
          fi
          echo "numero=$NUMERO" >> "$GITHUB_OUTPUT"
          echo "Issue detectado: ${NUMERO:-ninguno}"

      - name: Avisar que no hay issue
        if: steps.issue.outputs.numero == ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/$REPO/issues/$PR/comments" -f body="⚠️ QA no se ejecutó: no encontré el número del issue. Usa una rama \`claude/issue-N-…\`, agrega \`Refs #N\` en la descripción, o lánzalo a mano desde Actions → QA → Run workflow." >/dev/null

      - name: Checkout rama qa
        if: steps.issue.outputs.numero != ''
        uses: actions/checkout@v4
        with:
          ref: qa
          fetch-depth: 1

      - name: Instalar Node
        if: steps.issue.outputs.numero != ''
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias y navegador
        if: steps.issue.outputs.numero != ''
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Ejecutar pruebas
        if: steps.issue.outputs.numero != ''
        id: pruebas
        env:
          ISSUE: ${{ steps.issue.outputs.numero }}
        run: npm test 2>&1 | tee resultado.txt
        continue-on-error: true

      - name: Guardar evidencia en qa
        if: steps.issue.outputs.numero != ''
        env:
          ISSUE: ${{ steps.issue.outputs.numero }}
          RESULTADO: ${{ steps.pruebas.outcome }}
        run: |
          CARPETA=$(ls -d tests/evidencia/issue-$ISSUE/*/ 2>/dev/null | sort | tail -1)
          # Si una prueba falla, conservar también lo que Playwright registró del error
          if [ "$RESULTADO" = "failure" ] && [ -d test-results ] && [ -n "$CARPETA" ]; then
            mkdir -p "${CARPETA}fallo"
            cp -r test-results/. "${CARPETA}fallo/"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/evidencia
          git commit -m "Evidencia QA del issue #$ISSUE" || echo "Sin evidencia nueva"
          git push origin HEAD:qa

      - name: Publicar resultado en el issue
        if: steps.issue.outputs.numero != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.issue.outputs.numero }}
          RESULTADO: ${{ steps.pruebas.outcome }}
          REPO: ${{ github.repository }}
        run: |
          SHA=$(git rev-parse HEAD)
          CARPETA=$(ls -d tests/evidencia/issue-$ISSUE/*/ | sort | tail -1)
          MODELO=$(jq -r '.model // "sin modelo"' .claude/settings.json)
          NAVEGADOR=$(node -e "require('playwright-core').chromium.launch().then(async b=>{console.log('Chromium '+b.version());await b.close()})")
          PLAYWRIGHT=$(npx playwright --version | awk '{print $2}')
          DISPOSITIVO=$(. /etc/os-release; echo "$PRETTY_NAME, viewport 1080×1920")
          IMAGENES=""
          for f in "$CARPETA"*.png "$CARPETA"fallo/*.png; do
            [ -f "$f" ] || continue
            IMAGENES="$IMAGENES
          ![$(basename "$f" .png)](https://raw.githubusercontent.com/$REPO/$SHA/$f)"
          done
          {
            echo "### 🧪 Evidencia QA"
            if [ "$RESULTADO" = "success" ]; then
              echo "✅ Pruebas pasan en qa"
            else
              echo "❌ Pruebas fallan en qa"
              echo ""
              echo "**Revisión manual requerida.** El issue sigue abierto y \`main\` no cambia."
              echo ""
              echo "Causa (extracto de la ejecución):"
              echo '```'
              grep -E "Error:|✘" resultado.txt | head -8
              echo '```'
            fi
            echo ""
            echo "- Rama: \`qa\` (commit \`${SHA:0:7}\`)"
            echo "- Ejecución: \`$(basename "$CARPETA")\`"
            echo "- Modelo configurado: \`$MODELO\`"
            echo "- Navegador: \`$NAVEGADOR\` (Playwright $PLAYWRIGHT)"
            echo "- Dispositivo: $DISPOSITIVO"
            echo "$IMAGENES"
            echo ""
            echo "Aprobación del merge a \`main\`: manual."
          } > cuerpo.md
          gh api "repos/$REPO/issues/$ISSUE/comments" -F body=@cuerpo.md >/dev/null
